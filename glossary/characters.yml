  - chinese: 罗尘
    pinyin: Luo Chen
    english: Luo Chen
    type: character
    first_seen: chapter-1
    status: active
    notes: Main protagonist. Adept Stage Three. 4th-Tier Alchemist. Self-created Fine Dust Primordial Art. Life-bound treasure is the Primordial Unity Cauldron. Founded the Luo Tian Sect.

  - chinese: 韩瞻
    pinyin: Han Zhan
    english: Han Zhan
    type: character
    first_seen: chapter-523
    status: incapacitated
    notes: Sage-level cultivator of the Falling Cloud Sect. Specializes in divine soul attacks and puppet control. Currently a soul wisp sealed inside the Primordial Unity Cauldron after being critically wounded by Rosycloud's fire.

  - chinese: 栖霞元君
    pinyin: Qi Xia Yuan Jun
    english: Rosycloud
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Ancient Ascendant-level demon. Sole occupant of the Eastern Wilderness's fifth-tier Holy Land on Green Parasol Mountain. Rose ~1000 years ago after obtaining a phoenix legacy from the upper realm within the Lianxia Mountain Range. Never revealed herself. Remnant techniques obliterate Sages and force even Ascendants to retreat.

  - chinese: 天冶子
    pinyin: Tian Ye Zi
    english: Heaven Smelter
    type: character
    first_seen: chapter-523
    status: deceased
    notes: Grandmaster artisan. Forged the Primordial Unity Cauldron. Summoned azure (wind-element) chains from the cauldron; Luo Chen summons red (fire-element) chains.

  - chinese: 鹤清子
    pinyin: He Qing Zi
    english: Pure Crane
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Guarded the Lianxia Mountain Range alone after Rosycloud withdrew. Later associated with Cloud Crane.

  - chinese: 云鹤上人
    pinyin: Yun He Shang Ren
    english: Cloud Crane
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Was at Adept stage when he encountered Pure Crane. Current level unknown.

  - chinese: 幽泉
    pinyin: You Quan
    english: Nether Spring
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Provided Luo Chen with the Azure Luan feather as a temporary token for dungeon access.

  - chinese: 白美玲
    pinyin: Bai Mei Ling
    english: Bai Meiling
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Luo Chen's Dao companion. Formerly prepared spirit meals for him at Tianlan, aiding his body cultivation.

  - chinese: 玉姣龙
    pinyin: Yu Jiao Long
    english: Jadewater Dragon
    type: character
    first_seen: chapter-523
    status: unknown
    notes: True heavenly spirit root cultivator. Luo Chen's cultivation speed marginally surpasses hers.

  - chinese: 李金煌
    pinyin: Li Jin Huang
    english: Li Jinhuang
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Source of the Life-Severing Finger technique.

  - chinese: 慕云烟
    pinyin: Mu Yun Yan
    english: Mu Yunyan
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Member of the Falling Cloud Sect. Exchanged the Burning Crane alchemy technique with Luo Chen.

  - chinese: 青霜
    pinyin: Qing Shuang
    english: Azure Frost
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Participated in forging the Primordial Unity Cauldron alongside Heaven Smelter and Han Zhan.

  - chinese: 天星子
    pinyin: Tian Xing Zi
    english: Tian Xingzi
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Falling Cloud Sect member. Made a deal with Luo Chen during the battle at Incense Burning Valley.

  - chinese: 瞿希白
    pinyin: Qu Xi Bai
    english: Qu Xibai
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Falling Cloud Sect Adept elder. Opened Tianlan's sealing formation to help Luo Chen advance.
