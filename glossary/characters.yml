  - chinese: 黑脸大汉
    pinyin: Hei Lian Da Han
    english: the black-faced man
    type: character
    first_seen: chapter-524
    status: active
    notes: Unnamed leader of the demon-hunting vessel. Wields a long white banner. Commands two-tenths of his family's cultivator strength. Encountered Luo Chen in the Xingtian Sea.

  - chinese: 程吉
    pinyin: Cheng Ji
    english: Cheng Ji
    type: character
    first_seen: chapter-524
    status: incapacitated
    notes: Elderly Initiate cultivator who pilots the demon-hunting vessel. Suffered a formation backlash trying to force the ship forward against the serpent swarm; unconscious at chapter end.

  - chinese: 小十七
    pinyin: Xiao Shi Qi
    english: Little Seventeen
    type: character
    first_seen: chapter-524
    status: active
    notes: Crewmember aboard the demon-hunting vessel. Called upon by the black-faced man to rally all hands for battle.

  - chinese: 程海昌
    pinyin: Cheng Hai Chang
    english: Cheng Haichang
    type: character
    first_seen: chapter-525
    status: active
    notes: Black-faced Initiate Stage Three cultivator from the Cheng clan of Black Swan Island. Initially commands the demon-hunting vessel and later becomes Luo Chen's source of Northern Sea intelligence.

  - chinese: 程斗
    pinyin: Cheng Dou
    english: Cheng Dou
    type: character
    first_seen: chapter-526
    status: deceased
    notes: Head of the Black Swan Island Cheng clan. Initiate Stage Nine, suppressing his realm before Perfected Completion. Bets the clan's future on Luo Chen in order to remove Yan Nantian. Died attempting Core Formation after only 10 years on the Azure Yang Alchemy Canon — rushed it and suffered fatal backlash (ch560).

  - chinese: 程海心
    pinyin: Cheng Hai Xin
    english: Cheng Haixin
    type: character
    first_seen: chapter-527
    status: active
    notes: Cheng Dou's seventh sister, a tall Initiate cultivator who is sent to attend Luo Chen. Later receives Luo Chen's token in the form of the Water-Parting Spikes and gains the alias Invitation Moon Fairy.

  - chinese: 燕南天
    pinyin: Yan Nan Tian
    english: Yan Nantian
    type: character
    first_seen: chapter-529
    status: deceased
    notes: Also known as Senior Nantian. Adept ruler of the Swallow Islands, originally from Laboring Swallow Island. Used a water flying sword, Water-Parting Spikes, and a Myriad Souls Banner. Killed by Luo Chen in chapter 531.

  - chinese: 彭宇
    pinyin: Peng Yu
    english: Peng Yu
    type: character
    first_seen: chapter-530
    status: dead_soul
