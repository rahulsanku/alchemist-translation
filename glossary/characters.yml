  - chinese: 天璇
    pinyin: Tian Xuan
    english: Heavenjade
    type: spirit_beast_character
    first_seen: chapter-559
    status: active
    notes: Heavenly Pivot Fighting Gull that Luo Chen tamed; transformed into a Golden Core-stage female cultivator companion. Wind spirit root. Practices the Huan Yu Secret Canon (created by Luo Chen for her). Wields the upper-grade law device plantain fan. Fully healed from prior injuries (ch603).

  - chinese: 钓叟
    pinyin: Diao Sou
    english: Angler
    type: character
    first_seen: chapter-602
    status: active
    notes: Eight-star demon hunter in the Myriad Immortals Assembly. Golden Core Stage Nine. One of the three Demon Hunter Office chiefs. Has personal interest in body tempering. Accepted Luo Chen's gift of body cultivation notes + Tier-Three body cultivation method in exchange for access to premium cave listings.

  - chinese: 端离
    pinyin: Duan Li
    english: Duan Li
    type: character
    first_seen: chapter-602
    status: active
    notes: Foundation Establishment cultivator from Huanrui Island's Duan family. Lives in Hidden Wind Cave in Fulong Mountain Range. Has a powerful flower basket law device. Still recovering from old injuries.

  - chinese: 张甲第
    pinyin: Zhang Jia Di
    english: Zhang Jiadi
    type: character
    first_seen: chapter-602
    status: active
    notes: Former three-star demon hunter who surrendered his rank for a shop lease. Runs Azure Yang Hall in Longyuan Immortal City. Married to Wen Xiu, father of Zhang Jingqing. Foundation Establishment late stage.

  - chinese: 文秀
    pinyin: Wen Xiu
    english: Wen Xiu
    type: character
    first_seen: chapter-602
    status: active
    notes: Zhang Jiadi's wife. Foundation Establishment Stage Four. Manages Azure Yang Hall accounts and the Golden Dragon Carp farm on Cailian Island. Knows Golden Dragon Carp husbandry techniques.

  - chinese: 张敬青
    pinyin: Zhang Jing Qing
    english: Zhang Jingqing
    type: character
    first_seen: chapter-603
    status: active
    notes: Zhang Jiadi and Wen Xiu's daughter, nicknamed Qingqing. Approximately 4.5 years old. Named in honor of Luo Chen (Azure Yang). Given a protective feather by Heavenjade.

  - chinese: 摩云洞主
    pinyin: Mo Yun Dong Zhu
    english: Moya Cave Master
    type: character
    first_seen: chapter-603
    status: active
    notes: Golden Core Stage Seven. The Myriad Immortals Assembly's foremost artifact-forger. Runs Moya Cave. Was used by Huangfu Song as a probe against Luo Chen but declined further involvement. Holds Luo Chen in higher regard than he admits.

  - chinese: 皇甫嵩
    pinyin: Huang Fu Song
    english: Huangfu Song
    type: character
    first_seen: chapter-605
    status: active
    notes: Golden Core Stage Seven. Descendant of the Great Zhou royal clan. Seeks to restore the dynasty using Peng Lake as a base. Carries a senior's protective technique (expended in ch607 against the Azure Yang Great Handprint).

  - chinese: 紫后
    pinyin: Zi Hou
    english: Purple Dowager
    type: character
    first_seen: chapter-606
    status: active
    notes: Eight-star demon hunter. Golden Core Stage Nine. One of the three Demon Hunter Office chiefs. Former figurehead of the Great Zhou dynasty. Patron/relative of Huangfu Song (calls him "Songer"). Declined to openly interfere in the Peng Lake battle.

  - chinese: 鬼灵童子
    pinyin: Gui Ling Tong Zi
    english: Ghost Spirit Child
    type: character
    first_seen: chapter-606
    status: active
    notes: Eight-star demon hunter. Golden Core Stage Nine. One of the three Demon Hunter Office chiefs. Given up on reaching Nascent Soul; building a family legacy at Hundred Ghosts Cavern.

  - chinese: 夜老
    pinyin: Ye Lao
    english: Night Elder
    type: character
    first_seen: chapter-606
    status: active
    notes: Huangfu Song's formation master adviser. Former Grand Astrologer of the Great Zhou dynasty. Carries a star plate (星盘). Can locate enemies hidden in formation arrays; cannot quickly dismantle formations.

  - chinese: 桂公
    pinyin: Gui Gong
    english: Lord Gui
    type: character
    first_seen: chapter-607
    status: active
