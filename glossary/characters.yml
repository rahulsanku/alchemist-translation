  - chinese: 肖不桓
    pinyin: Xiao Bu Huan
    english: Xiao Buhuan
    type: character
    first_seen: chapter-602
    status: active
    notes: Cultivator friend Luo Chen knew from Quyang Island. Resides in Hengyue Cave in the Fulong Mountain Range, close to Duan Li's Hidden Wind Cave.
