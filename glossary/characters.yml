  - chinese: 七环
    pinyin: Qi Huan
    english: Qihuan
    type: demon_beast_character
    first_seen: chapter-553
    status: deceased
    notes: Ring-Headed Turtle Great Elder and supreme warrior. Used the Horizon Neighbor technique to share the amplified heavenly tribulation with all five crab patriarchs, dragging them down together. Transformed into a Cliff Serpent body during the failed tribulation. Deceased (ch556). His Cliff Serpent body was given to Black King to devour (ch557).

  - chinese: 桓寿
    pinyin: Huan Shou
    english: Huan Shou
    type: demon_beast_character
    first_seen: chapter-551
    status: deceased
