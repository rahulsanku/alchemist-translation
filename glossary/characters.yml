  - chinese: 罗尘
    pinyin: Luo Chen
    english: Luo Chen
    type: character
    first_seen: chapter-1
    status: active
    notes: Main protagonist. Golden Core Third Layer. 4th-Grade Alchemist. Self-created Dust Mote Origin Art. Natal treasure is the Primordial Cauldron. Founded the Luo Tian Sect.

  - chinese: 韩瞻
    pinyin: Han Zhan
    english: Han Zhan
    type: character
    first_seen: chapter-523
    status: incapacitated
    notes: Nascent Soul cultivator of the Falling Cloud Sect. Specializes in divine soul attacks and puppet manipulation. Currently a soul wisp sealed inside the Primordial Cauldron after being critically wounded by the Nirvana Sacred Flame.

  - chinese: 栖霞元君
    pinyin: Qi Xia Yuan Jun
    english: Qi Xia Yuan Jun
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Ancient God Transformation demon. Sole occupant of the Eastern Wasteland's fifth-grade holy ground on Cang Wu Mountain. Rose ~1000 years ago after obtaining a phoenix inheritance from the upper realm in the Lian Xia Mountain Range. Never shown her face. Remnant techniques block all Nascent Soul cultivators; even God Transformation experts must retreat.

  - chinese: 天冶子
    pinyin: Tian Ye Zi
    english: Tian Ye Zi
    type: character
    first_seen: chapter-523
    status: deceased
    notes: Artifact-forging grandmaster. Forged the Primordial Cauldron. Summoned azure (wind) chains from the cauldron; Luo Chen summons red (fire) chains.

  - chinese: 鹤清子
    pinyin: He Qing Zi
    english: He Qing Zi
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Guarded the Lian Xia Mountain Range alone after Qi Xia Yuan Jun withdrew. Later associated with Yun He Shang Ren.

  - chinese: 云鹤上人
    pinyin: Yun He Shang Ren
    english: Yun He Shang Ren
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Was at Golden Core stage when he encountered He Qing Zi. Current level unknown.

  - chinese: 幽泉
    pinyin: You Quan
    english: You Quan
    type: character
    first_seen: chapter-523
    status: unknown
    notes: Provided Luo Chen with the Azure Luan Feather as a temporary token for dungeon access.

  - chinese: 白美玲
    pinyin: Bai Mei Ling
    english: Bai Mei Ling
    type: character
    first_seen: chapter-523
    status: unknown
