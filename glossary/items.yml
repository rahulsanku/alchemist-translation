  - chinese: 混元鼎
    pinyin: Hun Yuan Ding
    english: Primordial Cauldron
    type: artifact
    first_seen: chapter-523
    status: active
    notes: Luo Chen's natal treasure. Forged by artifact-forging grandmaster Tian Ye Zi with contributions from Han Zhan and Qing Shuang. Innate functions include suppression, imprisonment, and binding. Tian Ye Zi summoned azure (wind) chains; Luo Chen summons red (fire) chains. Currently holds Han Zhan's soul wisp.

  - chinese: 青鸾之羽
    pinyin: Qing Luan Zhi Yu
    english: Azure Luan Feather
    type: artifact
    first_seen: chapter-523
    status: consumed
    notes: Temporary token from You Quan for dungeon access. Used unexpectedly as a teleportation key, activating Qi Xia Yuan Jun's supreme-grade array. Power fully dissipated after use. Destroyed by Luo Chen at the start of chapter 523.

  - chinese: 繁星丹
    pinyin: Fan Xing Dan
    english: Myriad Stars Pill
    type: pill
    first_seen: chapter-523
    status: active
    notes: 3rd-grade. High-grade and peak-grade versions. Luo Chen refined large quantities for self-use, an extravagance unheard of in the Eastern Wasteland. Current proficiency: Grand Perfection.

  - chinese: 化形丹
    pinyin: Hua Xing Dan
    english: Shape-Shifting Pill
    type: pill
    first_seen: chapter-523
    status: active
    notes: 4th-grade. Luo Chen reaching Novice rank in this pill elevated him to 4th-Grade Alchemist. Current proficiency: Novice 5/100.

  - chinese: 冥元丹
    pinyin: Ming Yuan Dan
    english: Dark Origin Pill
    type: pill
    first_seen: chapter-523
    status: active
    notes: 3rd-grade. Current proficiency: Novice 6/100.

  - chinese: 帝流浆
    pinyin: Di Liu Jiang
    english: Imperial Flow Elixir
    type: pill
    first_seen: chapter-523
    status: active
    notes: 2nd-grade. Current proficiency: Grand Perfection.

  - chinese: 玄火剑
    pinyin: Xuan Huo Jian
    english: Xuan Huo Sword
    type: weapon
    first_seen: chapter-523
    status: active
    notes: Luo Chen's sword. Used to destroy one corner of the teleportation array. [TERM?] — full name and grade unconfirmed.

  - chinese: 储物戒
    pinyin: Chu Wu Jie
    english: storage ring
    type: artifact
    first_seen: chapter-523
    status: active
    notes: Standard spatial storage item. Keep lowercase in prose.

  # --- Formations (Luo Chen's mastered set) ---

