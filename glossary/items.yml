  - chinese: 混元鼎
    pinyin: Hun Yuan Ding
    english: Primordial Unity Cauldron
    type: artifact
    first_seen: chapter-523
    status: active
    notes: Luo Chen's life-bound treasure. Forged by grandmaster artisan Heaven Smelter with contributions from Han Zhan and Azure Frost. Functions include suppression, confinement, and restraint. Heaven Smelter summoned azure (wind-element) chains; Luo Chen summons red (fire-element) chains. Currently holds Han Zhan's soul wisp.

  - chinese: 青鸾之羽
    pinyin: Qing Luan Zhi Yu
    english: Azure Luan feather
    type: artifact
    first_seen: chapter-523
    status: consumed
    notes: Temporary token from Nether Spring for dungeon access. Used as a teleportation key to activate Rosycloud's supreme-grade formation. Power fully dissipated after use. Destroyed in ch523.

  - chinese: 繁星丹
    pinyin: Fan Xing Dan
    english: Starfield Pill
    type: pill
    first_seen: chapter-523
    status: active
    notes: Third-tier pill. Top-grade and supreme-grade versions exist. Luo Chen refined large quantities for self-use — an extravagance unheard of in the Eastern Wilderness. Current proficiency: Perfected Mastery.

  - chinese: 化形丹
    pinyin: Hua Xing Dan
    english: Transformation Pill
    type: pill
    first_seen: chapter-523
    status: active
    notes: Fourth-tier pill. Reaching Beginner rank in this pill elevated Luo Chen to 4th-Tier Alchemist. Current proficiency: Beginner 5/100.

  - chinese: 冥元丹
    pinyin: Ming Yuan Dan
    english: Dark Origin Pill
    type: pill
    first_seen: chapter-523
    status: active
    notes: Third-tier pill. Current proficiency: Beginner 6/100.

  - chinese: 帝流浆
    pinyin: Di Liu Jiang
    english: Imperial Nectar
    type: pill
    first_seen: chapter-523
    status: active
    notes: Second-tier pill. Current proficiency: Perfected Mastery.

  - chinese: 玄火剑
    pinyin: Xuan Huo Jian
    english: Mystic Flame Sword
    type: weapon
    first_seen: chapter-523
    status: destroyed
    notes: Luo Chen's sword. Used to destroy one corner of the teleportation formation in ch523. DESTROYED in ch555 — crushed bodily by Golden Claw's golden claws; the soul-bond severance struck Luo Chen's divine soul like a physical blow.

  - chinese: 储物戒
    pinyin: Chu Wu Jie
    english: storage ring
    type: artifact
    first_seen: chapter-523
    status: active
    notes: Standard spatial storage item. Keep lowercase in prose.

  # --- Formations (Luo Chen's mastered set) ---

  - chinese: 隐为阵
    pinyin: Yin Wei Zhen
    english: Concealment Veil Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: Third-tier formation. Perfected Mastery. Even Sages cannot detect Luo Chen's aura without deliberately focusing. Manifests as black lines across exposed skin at maximum activation.

  - chinese: 聚灵阵
    pinyin: Ju Ling Zhen
    english: Spirit-Gathering Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: First-tier. Current proficiency: Grandmaster 800/1000.

  - chinese: 锐金阵
    pinyin: Rui Jin Zhen
    english: Sharp Metal Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: First-tier. Current proficiency: Grandmaster 750/1000.

  - chinese: 甲木阵
    pinyin: Jia Mu Zhen
    english: Armored Wood Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: First-tier. Current proficiency: Grandmaster 900/1000.

  - chinese: 沧元阵
    pinyin: Cang Yuan Zhen
    english: Azure Origin Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: First-tier. Current proficiency: Grandmaster 760/1000.

  - chinese: 聚火阵
    pinyin: Ju Huo Zhen
    english: Fire-Gathering Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: First-tier. Perfected Mastery.

  - chinese: 固甲阵
    pinyin: Gu Jia Zhen
    english: Iron Shell Formation
    type: formation
    first_seen: chapter-523
    status: active
    notes: First-tier. Current proficiency: Grandmaster 767/1000.

  # --- Consumables ---

  - chinese: 猴儿酒
    pinyin: Hou Er Jiu
    english: monkey wine
    type: consumable
    first_seen: chapter-524
    status: active
    notes: Third-tier spirit wine. Gathered from deep wilderness by a demon bird on Green Parasol Mountain as a disciple's gift to Luo Chen. Sweet, rich, and fragrant. Best used for recovering mana. Insignificant to Sages; genuinely valuable for Adepts.

  - chinese: 附灵法器
    pinyin: Fu Ling Fa Qi
    english: spirit-bonded weapons
    type: artifact
    first_seen: chapter-524
    status: active
    notes: Enchanted weapons distributed to mortal sailors aboard the demon-hunting vessel. Glow when inner qi is channeled into them.

  - chinese: 白色长幡
    pinyin: Bai Se Chang Fan
    english: white banner
    type: weapon
    first_seen: chapter-524
    status: active
    notes: The black-faced man's weapon. Exhales billowing mist and can envelop objects or people for transport through the air.

  # --- Demon Beasts ---

  - chinese: 蓝环海蛇
    pinyin: Lan Huan Hai She
    english: Blue-Ringed Sea Serpent
    type: demon_beast
    first_seen: chapter-524
    status: active
    notes: First-tier demon beast. Coastal and ocean-dwelling. Hunts in massive swarms. Launches poison-laced water arrows. Intelligent enough to cooperate — can create whirlpools by coordinated swimming to drag vessels under.

  - chinese: 蓝环巨牙海蛇
    pinyin: Lan Huan Ju Ya Hai She
    english: Blue-Ringed Fang Serpent
    type: demon_beast
    first_seen: chapter-524
    status: active
    notes: Second-tier demon beast. Distinguished from ordinary Blue-Ringed Sea Serpents by their large fangs. The swarm leader captured by Luo Chen was a second-tier late-stage specimen, nine zhang long and resembling a small flood dragon.

  - chinese: 黑环雪蟒
    pinyin: Hei Huan Xue Mang
    english: Black-Ringed Snow Python
    type: demon_beast
    first_seen: chapter-524
    status: active
    notes: Native to the Great Snowy Mountains. Visually similar to Blue-Ringed Sea Serpents but less intelligent. Referenced by Luo Chen for comparison.

  - chinese: 猎妖船
    pinyin: Lie Yao Chuan
    english: demon-hunting ship
    type: vessel
    first_seen: chapter-526
    status: active
    notes: Northern Sea sea-and-air vessel refined by the Tianyuan Merchant Alliance from dragon whale bone; used by cultivation clans for distant-sea hunting.

  - chinese: 炼魂幡
    pinyin: Lian Hun Fan
    english: Soul-Refining Banner
    type: artifact
    first_seen: chapter-526
    status: active
    notes: Soul-path banner from Primordial Demon Sect methods. Cheng Haichang has a supreme-grade version; Yan Nantian has a higher Myriad Souls Banner variant.

  - chinese: 万魂幡
    pinyin: Wan Hun Fan
    english: Myriad Souls Banner
    type: artifact
    first_seen: chapter-530
    status: active
    notes: Yan Nantian's soul banner containing myriad souls, eight late-stage Initiate split souls, and an Adept main soul. Captured by Luo Chen after Yan Nantian's death.

  - chinese: 分水刺
    pinyin: Fen Shui Ci
    english: Water-Parting Spike
    type: artifact
    first_seen: chapter-529
    status: captured
    notes: Pair of low-grade treasure spikes used by Yan Nantian, able to part water and transform into dragons. Later given by Luo Chen to Cheng Haixin as his token.

  - chinese: 破月羽翼
    pinyin: Po Yue Yu Yi
    english: Broken Moon Wings
    type: artifact
    first_seen: chapter-526
    status: active
    notes: Luo Chen's fire-attribute wing treasure. Highly refined and used to empower the Nine Thousand Li movement art.

  - chinese: 破气钉
    pinyin: Po Qi Ding
    english: Qi-Breaking Nail
    type: artifact
    first_seen: chapter-531
    status: active
    notes: Black nail treasure Luo Chen uses against Yan Nantian's water dragons.

  - chinese: 破魂钉
    pinyin: Po Hun Ding
    english: Soul-Breaking Nail
    type: artifact
    first_seen: chapter-531
    status: active
    notes: Black nail treasure Luo Chen uses against Yan Nantian's water dragons.

  - chinese: 海魂阵
    pinyin: Hai Hun Zhen
    english: Sea Soul Formation
    type: formation
    first_seen: chapter-526
    status: active
    notes: Standard large demon-hunting ship formation that draws on sea power and sea demon souls, growing stronger as battle continues.

  - chinese: 万魂大阵
    pinyin: Wan Hun Da Zhen
    english: Myriad Souls Grand Formation
    type: formation
    first_seen: chapter-530
    status: destroyed
    notes: Formation formed from Yan Nantian's Myriad Souls Banner over Invitation Moon Island.

  - chinese: 鬼雾大阵
