  # --- Cultivation Methods ---

  - chinese: 天凰涅槃经
    pinyin: Tian Huang Nie Pan Jing
    english: Heavenly Phoenix Nirvana Scripture
    type: cultivation_method
    first_seen: chapter-523
    status: active
    notes: Fire-type cultivation method. Converts all mana to fire-element over time. Hailed as the progenitor of all fire arts — even Holy Lands across the Five Continents may not possess it. Obtained on Green Parasol Mountain. Cost 10 Achievement Points to reach Beginner rank. Current proficiency: Skilled 101/200.

  - chinese: 万道合流
    pinyin: Wan Dao He Liu
    english: Myriad Path Convergence
    type: cultivation_method
    first_seen: chapter-523
    status: active
    notes: Luo Chen's self-created body cultivation method. Drives Archaic Tier progression. Current proficiency: Grandmaster 657/1000.

  - chinese: 万兽经
    pinyin: Wan Shou Jing
    english: Myriad Beast Sutra
    type: cultivation_method
    first_seen: chapter-523
    status: active
    notes: Current proficiency: Beginner 15/100.

  # --- Spells ---

  - chinese: 斩龙术
    pinyin: Zhan Long Shu
    english: Dragon-Slaying Art
    type: spell
    first_seen: chapter-523
    status: active
    notes: Fourth-tier spell. Current proficiency: Skilled 175/200.

  - chinese: 先天一气大手印
    pinyin: Xian Tian Yi Qi Da Shou Yin
    english: Great Handprint of Primordial Qi
    type: spell
    first_seen: chapter-523
    status: active
    notes: Third-tier spell. Can be powered by all five elemental mana types, each producing different effects. As Luo Chen's mana converts fully to fire via the Heavenly Phoenix Nirvana Scripture, it becomes a pure fire killing technique. Current proficiency: Grandmaster 810/1000.

  - chinese: 镜花水月
