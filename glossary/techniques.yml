  # --- Fire Abilities (see unresolved-terms for disambiguation) ---

  - chinese: 枯荣真火
    pinyin: Ku Rong Zhen Huo
    english: Withering-Bloom True Fire
    type: technique
    first_seen: chapter-523
    status: active
    notes: Luo Chen's cyan fire. Used to nearly destroy Han Zhan's soul wisp. Relationship to the Heavenly Phoenix Nirvana Sutra is unclear. [TERM?]

  - chinese: 涅槃圣火
    pinyin: Nie Pan Sheng Huo
    english: Nirvana Sacred Flame
    type: technique
    first_seen: chapter-523
    status: active
    notes: Critically wounded Han Zhan and consumed his contingency power. Appears distinct from and more powerful than Withering-Bloom True Fire. Origin unclear. [TERM?]
