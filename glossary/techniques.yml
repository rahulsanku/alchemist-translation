  # --- Cultivation Methods ---

  - chinese: 天凰涅槃经
    pinyin: Tian Huang Nie Pan Jing
    english: Heavenly Phoenix Nirvana Scripture
    type: cultivation_method
    first_seen: chapter-523
    status: active
    notes: Fire-type cultivation method. Converts all mana to fire-element over time. Hailed as the progenitor of all fire arts — even Holy Lands across the Five Continents may not possess it. Obtained on Green Parasol Mountain. Cost 10 Achievement Points to reach Beginner rank. Current proficiency: Skilled 101/200.

  - chinese: 万道合流
    pinyin: Wan Dao He Liu
    english: Myriad Path Convergence
    type: cultivation_method
    first_seen: chapter-523
    status: active
    notes: Luo Chen's self-created body cultivation method. Drives Archaic Tier progression. Current proficiency: Grandmaster 657/1000.

  - chinese: 万兽经
    pinyin: Wan Shou Jing
    english: Myriad Beast Sutra
    type: cultivation_method
    first_seen: chapter-523
    status: active
    notes: Current proficiency: Beginner 15/100.

  # --- Spells ---

  - chinese: 斩龙术
    pinyin: Zhan Long Shu
    english: Dragon-Slaying Art
    type: spell
    first_seen: chapter-523
    status: active
    notes: Fourth-tier spell. Current proficiency: Skilled 175/200.

  - chinese: 先天一气大手印
    pinyin: Xian Tian Yi Qi Da Shou Yin
    english: Great Handprint of Primordial Qi
    type: spell
    first_seen: chapter-523
    status: active
    notes: Third-tier spell. Can be powered by all five elemental mana types, each producing different effects. As Luo Chen's mana converts fully to fire via the Heavenly Phoenix Nirvana Scripture, it becomes a pure fire killing technique. Current proficiency: Grandmaster 810/1000.

  - chinese: 镜花水月
    pinyin: Jing Hua Shui Yue
    english: Mirror Flower Water Moon
    type: spell
    first_seen: chapter-523
    status: active
    notes: Third-tier spell. Current proficiency: Perfected Mastery.

  - chinese: 微尘元术
    pinyin: Wei Chen Yuan Shu
    english: Fine Dust Primordial Art
    type: spell
    first_seen: chapter-523
    status: active
    notes: Third-tier spell. Self-created by Luo Chen. Cultivated for 30+ years. Aids Core Formation success rate beyond most top-grade secret arts. Current proficiency: Perfected Mastery.

  - chinese: 截生指
    pinyin: Jie Sheng Zhi
    english: Life-Severing Finger
    type: spell
    first_seen: chapter-523
    status: active
    notes: Third-tier spell. Obtained from Li Jinhuang. Extracts life force from targets, but the gain dissipates quickly and does not halt Luo Chen's own natural lifespan drain. Considered impractical in current circumstances. Current proficiency: Beginner 15/100.

  # --- Martial Arts ---

  - chinese: 探云神爪
    pinyin: Tan Yun Shen Zhua
    english: Cloud-Seizing Divine Claw
    type: martial_art
    first_seen: chapter-523
    status: active
    notes: Current proficiency: Grandmaster 590/1000.

  - chinese: 烈火瘴
    pinyin: Lie Huo Zhang
    english: Blazing Fire Miasma
    type: martial_art
    first_seen: chapter-523
    status: active
    notes: Current proficiency: Grandmaster 530/1000.

  # --- Alchemy Techniques ---

  - chinese: 鳞转手
    pinyin: Lin Zhuan Shou
    english: Scaled Shift
    type: alchemy_technique
    first_seen: chapter-523
    status: active
    notes: Current proficiency: Grandmaster 580/1000.

  - chinese: 焚鹤手
    pinyin: Fen He Shou
    english: Burning Crane
    type: alchemy_technique
    first_seen: chapter-523
    status: active
    notes: Obtained from Mu Yunyan of the Falling Cloud Sect. Suited for fire-element medicinal materials, including those used in Nascent Soul Pills. Current proficiency: Beginner 77/100.

  # --- Fire Abilities ---

  - chinese: 枯荣真火
    pinyin: Ku Rong Zhen Huo
    english: azure flame
    type: ability
    first_seen: chapter-523
    status: active
    notes: Luo Chen's unnamed azure fire ability. Used when he nearly destroyed Han Zhan's soul wisp. Not given a formal name in the translation — render as "azure flame" or "his azure fire" in prose.

  - chinese: 涅槃圣火
    pinyin: Nie Pan Sheng Huo
    english: Rosycloud's fire
    type: ability
    first_seen: chapter-523
    status: active
    notes: Belongs to Rosycloud (Qi Xia Yuan Jun), not Luo Chen. A single wisp of it critically wounded Han Zhan and consumed all his contingency power. Render as "Rosycloud's fire" in prose.
